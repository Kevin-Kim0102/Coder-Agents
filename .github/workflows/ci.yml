name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install packaging test dependencies
        run: python3 -m pip install "setuptools>=61" wheel
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: DOM tests
        run: |
          npm ci
          npm test
